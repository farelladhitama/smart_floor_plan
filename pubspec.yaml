name: smart_floor_plan
description: "Aplikasi Pembuat dan Analisis Denah Rumah Berbasis AI dan Computer Vision"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  get: ^4.7.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3

  # Pastikan tambahkan ini untuk memutar video splash
  video_player: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Gabungkan semua asset di sini
  assets:
    - assets/videos/splash_bg.mp4
    - assets/images/logodenah.png