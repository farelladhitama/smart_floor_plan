name: smart_floor_plan
description: "Aplikasi Pembuat dan Analisis Denah Rumah Otomatis"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1 

  get: ^4.7.3
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.3

  video_player: ^2.8.1
  image_picker: ^1.2.2
  image: ^4.8.0
  http: ^1.6.0
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.12.4
  pdf: ^3.12.0
  printing: ^5.14.3
  camera: ^0.12.0+1
  camera_web: ^0.3.5+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/videos/
    - assets/images/